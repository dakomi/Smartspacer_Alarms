plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dakomi.smartspacer.alarms'
    compileSdk 37

    defaultConfig {
        applicationId "com.dakomi.smartspacer.alarms"
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig true
        aidl true
        viewBinding true
    }

    // Load release signing config from a properties file when provided (CI / local release build).
    // Usage: ./gradlew assembleRelease -PsigningPropertiesFile=/path/to/signing.properties
    // The file must contain: storeFile, storePassword, keyAlias, keyPassword
    def signingPropsFile = project.hasProperty('signingPropertiesFile')
        ? new File(project.property('signingPropertiesFile') as String)
        : null

    if (signingPropsFile?.exists()) {
        def signingProps = new Properties()
        signingPropsFile.withInputStream { signingProps.load(it) }

        signingConfigs {
            release {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPropsFile?.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    sourceSets {
        main {
            kotlin.srcDirs = ['src/main/kotlin']
        }
    }
}

dependencies {
    implementation 'com.kieronquinn.smartspacer:sdk-plugin:1.1.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}
