name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Write signing config
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
        run: |
          cat > signing.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.jks
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build release APK (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: ./gradlew :app:assembleRelease -PsigningPropertiesFile="$GITHUB_WORKSPACE/signing.properties"

      - name: Build release APK (unsigned fallback)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: ./gradlew :app:assembleRelease

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          # Rename to a friendly filename including the tag
          TAG="${GITHUB_REF_NAME}"
          DEST="app-release-${TAG}.apk"
          cp "$APK" "$DEST"
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Next Alarm for Smartspacer ${{ github.ref_name }}"
          body: |
            ## Next Alarm for Smartspacer ${{ github.ref_name }}

            A Smartspacer plugin that surfaces the next alarm from your chosen clock app(s).

            ### Installation
            1. Download `${{ steps.find_apk.outputs.apk_name }}` below.
            2. Install it on your device (enable *Install from unknown sources* if needed).
            3. Open **Smartspacer** → add the **Next Alarm** target or complication.
            4. Follow the setup wizard to grant Shizuku permission and select your clock app(s).

            ### Requirements
            - Android 10+ (API 29)
            - [Smartspacer](https://github.com/KieronQuinn/Smartspacer)
            - [Shizuku](https://shizuku.rikka.app/) (optional, enables per-app filtering)
          files: ${{ steps.find_apk.outputs.apk_name }}
          draft: false
          prerelease: false
